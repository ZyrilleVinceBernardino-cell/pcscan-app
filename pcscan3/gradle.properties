# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
android.gradle.optimizeWorkers=false
# DISABLED external build cache redirect (TRAE sandbox requires local builds)
# systemProp.java.io.tmpdir=C:/Users/lalis/android_build_cache/pcscan3/_tmp
# org.gradle.project.buildDir=C:/Users/lalis/android_build_cache/pcscan3/root_project/build
# R.jar LOCK FIX: reduce writes to R class
android.defaults.buildfeatures.buildconfig=false
android.enableR8.fullMode=false
android.experimental.disableResourceIds=true
# Resource processing serialize writes
android.gradle.resource.keepRClassInJar=false
